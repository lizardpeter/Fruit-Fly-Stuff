[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-fly-stuff"
version = "0.1.0"
description = "Experiments with discrete-time spiking neural circuits, plasticity, and persistent checkpoints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["computational-neuroscience", "connectome", "spiking-neural-networks"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fruit-fly-demo = "fruit_fly_stuff.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
