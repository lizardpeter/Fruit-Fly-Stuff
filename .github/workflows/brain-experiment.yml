name: Run Brain Experiment

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Paired learning trials this run (3 lets memory build over runs)"
        type: choice
        required: true
        default: "3"
        options:
          - "1"
          - "3"
          - "6"
          - "12"
      reset:
        description: "Start over (replaces previously saved toy-brain memory)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

# Prevent two runs from overwriting each other's learned checkpoints.
concurrency:
  group: fruit-fly-toy-brain-state
  cancel-in-progress: false

jobs:
  experiment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the simulator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the simulator
        run: python -m pip install -e .

      - name: Restore memory from a previous Actions run
        shell: bash
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads origin simulation-state > "$RUNNER_TEMP/state-ref.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin "refs/heads/simulation-state:refs/remotes/origin/simulation-state"
            if ! git cat-file -e "refs/remotes/origin/simulation-state:state/toy-brain.npz" 2>/dev/null; then
              echo "::error::Memory branch exists but checkpoint is missing. Refusing to silently discard memory."
              exit 1
            fi
            mkdir -p state
            git show "refs/remotes/origin/simulation-state:state/toy-brain.npz" > state/toy-brain.npz
            echo "Restored a previous checkpoint."
          elif [ "$status" -eq 2 ]; then
            echo "No memory branch yet. This will be the first experiment."
          else
            echo "::error::Could not check for the saved memory branch (status $status)."
            exit 1
          fi

      - name: Run learning trials and test restored recall
        shell: bash
        env:
          TRIALS: ${{ inputs.trials }}
          RESET: ${{ inputs.reset }}
        run: |
          set -euo pipefail
          python -m fruit_fly_stuff.actions_experiment \
            --checkpoint state/toy-brain.npz \
            --trials "$TRIALS" \
            --reset "$RESET" \
            --report results/experiment.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Persist learned memory across GitHub Actions runs
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/brain-state-worktree"
          if git show-ref --verify --quiet refs/remotes/origin/simulation-state; then
            git worktree add -B simulation-state "$workspace" refs/remotes/origin/simulation-state
          else
            git worktree add -b simulation-state "$workspace" HEAD
          fi
          mkdir -p "$workspace/state"
          cp state/toy-brain.npz "$workspace/state/toy-brain.npz"
          git -C "$workspace" config user.name "github-actions[bot]"
          git -C "$workspace" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$workspace" add -f state/toy-brain.npz
          if ! git -C "$workspace" diff --cached --quiet; then
            git -C "$workspace" commit -m "Save toy brain state from Actions run #$GITHUB_RUN_NUMBER"
          fi
          git -C "$workspace" push origin HEAD:refs/heads/simulation-state
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The learned checkpoint is saved on the **simulation-state** branch." >> "$GITHUB_STEP_SUMMARY"

      - name: Attach experiment report and checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: toy-brain-run-${{ github.run_number }}
          path: |
            results/experiment.json
            state/toy-brain.npz
          if-no-files-found: error
          retention-days: 30
