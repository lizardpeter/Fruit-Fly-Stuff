name: Rust Vulkan Engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "Run-Vulkan-World.cmd"
      - ".github/workflows/rust-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "Run-Vulkan-World.cmd"
      - ".github/workflows/rust-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate build and test Rust logic
        run: |
          cargo check --manifest-path engine/Cargo.toml --all-targets
          cargo test --manifest-path engine/Cargo.toml


  linux-vulkan-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install headless X11 and Mesa Vulkan CPU driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Verify the software Vulkan ICD
        run: |
          ls -l /usr/share/vulkan/icd.d
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json vulkaninfo --summary
      - name: Build native window executable
        run: cargo build --manifest-path engine/Cargo.toml
      - name: Present five 3D Vulkan frames in virtual X11
        run: |
          timeout 45s xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            FRUIT_FLY_SMOKE_FRAMES=5 \
            ./engine/target/debug/fruit-fly-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python neural worker and dependencies
        run: python -m pip install -e .
      - name: Exercise Vulkan-to-Python closed-loop neural bridge
        run: |
          timeout 90s xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            FRUIT_FLY_SMOKE_FRAMES=240 \
            FRUIT_FLY_RETINA_VERIFY_GPU=1 \
            FRUIT_FLY_BRAIN_MODE=toy \
            FRUIT_FLY_EYE_SNAPSHOT="$GITHUB_WORKSPACE/results/fly-eye.bmp" \
            FRUIT_FLY_PYTHON=python \
            FRUIT_FLY_ROOT="$GITHUB_WORKSPACE" \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            ./engine/target/debug/fruit-fly-engine 2>&1 | tee "$RUNNER_TEMP/bridge-log.txt"
          grep -q "Neural bridge ready: toy with 4 neurons" "$RUNNER_TEMP/bridge-log.txt"
          grep -q "Neural step" "$RUNNER_TEMP/bridge-log.txt"
          grep -q "Retina GPU/CPU parity PASS:" "$RUNNER_TEMP/bridge-log.txt"
          grep -Eq "Fly-eye GPU pixels captured=[1-9][0-9]*" "$RUNNER_TEMP/bridge-log.txt"
          python - <<'PY'
          from pathlib import Path
          image = Path('results/fly-eye.bmp').read_bytes()
          assert image[:2] == b'BM'
          assert int.from_bytes(image[18:22], 'little') == 128
          assert int.from_bytes(image[22:26], 'little') == 96
          assert len(image) == 54 + 128 * 96 * 4
          print('Real Vulkan fly-eye screenshot saved and validated.')
          PY
      - name: Black-screen regression - darkness is valid neural input
        run: |
          timeout 45s xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            FRUIT_FLY_SMOKE_FRAMES=5 \
            FRUIT_FLY_SMOKE_BLACK_EYE=1 \
            FRUIT_FLY_RETINA_VERIFY_GPU=1 \
            ./engine/target/debug/fruit-fly-engine 2>&1 | tee "$RUNNER_TEMP/black-eye-log.txt"
          grep -q "Retina GPU/CPU parity PASS:" "$RUNNER_TEMP/black-eye-log.txt"
          grep -q "Vulkan smoke: presented 5 frames" "$RUNNER_TEMP/black-eye-log.txt"
      - name: World visual event: verify real GPU retina responds to light onset and offset
        run: |
          timeout 65s xvfb-run -a env \
            VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            FRUIT_FLY_SMOKE_FRAMES=240 \
            FRUIT_FLY_VISION_TRIAL=1 \
            ./engine/target/debug/fruit-fly-engine 2>&1 | tee "$RUNNER_TEMP/retina-trial-log.txt"
          grep -q "Retina visual trial PASS:" "$RUNNER_TEMP/retina-trial-log.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: fly-eye-camera-snapshot
          path: results/fly-eye.bmp
          if-no-files-found: error
          retention-days: 30

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate and test Rust code
        run: |
          cargo check --manifest-path engine/Cargo.toml --all-targets
          cargo test --manifest-path engine/Cargo.toml
      - name: Build Windows executable
        run: cargo build --release --manifest-path engine/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: fruit-fly-vulkan-windows
          path: engine/target/release/fruit-fly-engine.exe
          if-no-files-found: error
          retention-days: 30
