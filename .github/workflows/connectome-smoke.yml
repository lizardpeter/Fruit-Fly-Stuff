name: Connectome data integration smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/fruit_fly_stuff/whole_brain.py
      - src/fruit_fly_stuff/neural_bridge.py
      - .github/workflows/connectome-smoke.yml

permissions:
  contents: read

jobs:
  validate-real-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Download real FAFB v783 full neuron and unfiltered edge exports
        run: python -m fruit_fly_stuff.whole_brain download --variant unfiltered --annotations --retinotopy
      - name: Build all-neuron sparse connectivity cache
        run: python -m fruit_fly_stuff.whole_brain prepare --variant unfiltered
      - name: Assert complete real release imported
        run: |
          python - <<'PY'
          from pathlib import Path
          from fruit_fly_stuff.whole_brain import load_graph
          matrix, roots, info = load_graph(Path('data/fafb783/processed'))
          print(info)
          assert len(roots) == 139255, "Unexpected v783 neuron count: source may have changed"
          assert matrix.shape == (139255, 139255)
          assert info["variant"] == "unfiltered"
          assert matrix.nnz > 1_000_000
          assert info["synaptic_contacts_in_input"] > 1_000_000
          PY
      - name: Run 10 live steps and produce state checkpoint
        run: |
          python -m fruit_fly_stuff.whole_brain run --steps 10 --stimulated-count 100 --checkpoint-every 10
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          with np.load('state/whole-brain.npz', allow_pickle=False) as state:
              assert int(state['steps'][0]) == 10
              assert state['voltage'].shape == (139255,)
          PY
      - name: Test connected full-connectome neural bridge using real FlyWire graph
        run: |
          python - <<'PY'
          from pathlib import Path
          from fruit_fly_stuff.neural_bridge import BrainAdapter
          data=Path('data/fafb783/processed')
          checkpoint=Path('state/bridge-full-ci.npz')
          bridge=BrainAdapter('full', data, checkpoint, mapping='probes')
          print(bridge.hello())
          assert bridge.hello()['neurons']==139255
          step0=bridge.step(0, 1.0, 1.0)
          step1=bridge.step(1, 0.0, 0.0)
          print('Inputs fire:', step0)
          print('Observed downstream outputs:', step1)
          assert step1['active'] > 0
          assert step1['left'] + step1['right'] >= 1, 'Artificial strong-edge probe should propagate activity'
          bridge.save()
          restored=BrainAdapter('full', data, checkpoint, mapping='probes')
          assert restored.brain.steps==2
          print('Checkpoint restoration: PASS')
          classified=BrainAdapter('full', data, Path('state/bridge-classified-ci.npz'), mapping='classified')
          hello=classified.hello()
          print('Classified sensor/motor groups:', hello['anatomical_groups'])
          assert hello['anatomical_groups']['counts']['visual_left'] > 0
          assert hello['anatomical_groups']['counts']['visual_right'] > 0
          assert hello['anatomical_groups']['counts']['descending_left'] > 0
          assert hello['anatomical_groups']['counts']['descending_right'] > 0
          response=classified.step(1,1.0,0.0)
          print('Classified-mode neural response:', response)
          classified.save()
          PY

      - name: Compile FAFB L1/L2 columns and check individual receptor drive
        run: |
          python -m fruit_fly_stuff.retinotopy --approximate
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          from fruit_fly_stuff.retinotopy import load_mapping
          from fruit_fly_stuff.neural_bridge import BrainAdapter
          cache=Path('data/fafb783/processed')
          ids, facets, meta=load_mapping(cache/'retinotopy.json',cache)
          print({k:v for k,v in meta.items() if k!='entries'})
          assert len(ids)>1000
          assert np.any(facets<721) and np.any(facets>=721)
          b=BrainAdapter('full',cache,Path('state/retina-full-ci.npz'),mapping='retinotopic')
          # Verify L1 ON and L2 OFF selectively stimulate the actual
          # source-identified cells, not merely some unrelated graph activity.
          l1=next(r for r in meta['entries'] if r['type']=='L1')
          l2=next(r for r in meta['entries'] if r['type']=='L2')
          quiet=np.zeros(1442,dtype=np.float32)
          on=quiet.copy()
          on[l1['facet_index']]=1.0
          result_on=b.step(0,0,0,on.tolist(),quiet.tolist())
          assert bool(b.brain.spikes[l1['neuron_index']])
          print('Real L1 ON pathway:',result_on)
          off=quiet.copy()
          off[l2['facet_index']]=1.0
          result_off=b.step(1,0,0,quiet.tolist(),off.tolist())
          assert bool(b.brain.spikes[l2['neuron_index']])
          print('Real L2 OFF pathway:',result_off)
          assert b.hello()['retinotopy']['kind']=='UNVALIDATED_axial_fit'
          b.save()
          PY
