name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,plots]'
      - name: Test
        run: python -m pytest -q
      - name: Exercise Hodgkin-Huxley plots and CSV export
        run: |
          python -m fruit_fly_stuff.biophysical --plot --duration-ms 80
          python -c "from pathlib import Path; assert Path('results/biophysical/hh_neurons.png').stat().st_size > 1000; assert Path('results/biophysical/hh_neurons.csv').stat().st_size > 100"
      - name: Check demo
        run: python -m fruit_fly_stuff.demo --checkpoint state/toy-brain.npz
